<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundSniff Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a1628;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #00d4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .desc {
      font-size: 12px;
      color: #5a6f8a;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .desc a {
      color: #00d4ff;
      text-decoration: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f1f3d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #00d4ff;
    }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      background: #0f1f3d;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-val {
      font-size: 13px;
      font-weight: 500;
      color: #00d4ff;
      min-width: 32px;
      text-align: right;
    }

    button {
      padding: 8px 16px;
      background: #0f1f3d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      color: #8899b3;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #1a2d52;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <h1>SoundSniff Settings</h1>

  <div class="setting-group">
    <label>API Token</label>
    <p class="desc">
      Optional. Get your own token at
      <a href="https://dashboard.audd.io" target="_blank">dashboard.audd.io</a>
      for unlimited recognition. Without a token, you get 10 free requests/day.
    </p>
    <input type="text" id="token" placeholder="Leave empty for free tier" autocomplete="off" />
  </div>

  <div class="setting-group">
    <label>Recording Length</label>
    <p class="desc">Longer clips may improve accuracy. Default: 10 seconds.</p>
    <div class="range-row">
      <input type="range" id="length" min="5" max="30" value="10" step="1" />
      <span class="range-val" id="length-val">10s</span>
    </div>
  </div>

  <div class="setting-group">
    <button id="save">Save Settings</button>
  </div>

  <script src="js/options.js"></script>
</body>
</html>
