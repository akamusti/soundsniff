<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundSniff Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a1628;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #00d4ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .desc {
      font-size: 12px;
      color: #5a6f8a;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .desc a {
      color: #00d4ff;
      text-decoration: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #0f1f3d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #00d4ff;
    }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      height: 4px;
      background: #0f1f3d;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #00d4ff;
      cursor: pointer;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-val {
      font-size: 13px;
      font-weight: 500;
      color: #00d4ff;
      min-width: 32px;
      text-align: right;
    }

    button {
      padding: 8px 16px;
      background: #0f1f3d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      color: #8899b3;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #1a2d52;
      color: #ffffff;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      background: #0f1f3d;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
  </style>
</head>
<body>
  <h1 data-i18n="opt_title">SoundSniff Settings</h1>

  <div class="setting-group">
    <label for="lang" data-i18n="lang_label">Language</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="tr">Türkçe</option>
    </select>
  </div>

  <div class="setting-group">
    <label for="token"><span data-i18n="token_label">AudD API key</span> <span data-i18n="token_opt">(optional)</span></label>
    <p class="desc">
      <span data-i18n="token_desc">Leave empty to use the free quota. For more recognitions, get a free key at</span>
      <a href="https://dashboard.audd.io" target="_blank">dashboard.audd.io</a>
    </p>
    <input type="text" id="token" data-i18n-ph="token_ph" placeholder="Can be left empty" autocomplete="off" />
  </div>

  <div class="setting-group">
    <label for="length" data-i18n="reclen_label">Recording length</label>
    <p class="desc" data-i18n="reclen_desc">Longer recordings usually give more accurate results.</p>
    <div class="range-row">
      <input type="range" id="length" min="5" max="30" value="10" step="1" />
      <span class="range-val" id="length-val">10s</span>
    </div>
  </div>

  <div class="setting-group">
    <label for="autostart"><span data-i18n="autostart_label">Auto-listen on open</span></label>
    <p class="desc" data-i18n="autostart_desc">Start recognizing as soon as the popup opens. Only runs after you click the toolbar button — never in the background.</p>
    <label style="display:flex;align-items:center;gap:10px;font-size:13px;text-transform:none;letter-spacing:0;">
      <input type="checkbox" id="autostart" checked style="width:18px;height:18px;" />
      <span data-i18n="autostart_label">Auto-listen on open</span>
    </label>
  </div>

  <div class="setting-group">
    <button id="save" data-i18n="opt_save">Save Settings</button>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="js/options.js"></script>
</body>
</html>
